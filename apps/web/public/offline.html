<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | UNAI CRM</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #17191a;
        background: linear-gradient(180deg, #f8f7ff 0%, #ffffff 100%);
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid rgba(98, 83, 248, 0.14);
        border-radius: 24px;
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 24px 50px -18px rgba(98, 83, 248, 0.16);
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        display: block;
        border-radius: 14px;
        object-fit: contain;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        font-size: 0.92rem;
        line-height: 1.55;
        color: #5e6360;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 11px 22px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #7957f6 0%, #6253f8 50%, #4054f5 100%);
        color: #ffffff;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 20px -6px rgba(98, 83, 248, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192x192.png" alt="UNAI CRM" class="logo" />
      <h1>You&rsquo;re offline</h1>
      <p>
        UNAI CRM cannot reach the server right now. Check your internet connection and tap retry to continue your dealership work.
      </p>
      <button type="button" onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
